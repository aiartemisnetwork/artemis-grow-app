  <style>
/* =====================================================================
   Artemis Grow — styles (Artemis Network theme)
   ===================================================================== */
:root {
  --bg: #050B24;
  --card: #0D1A3F;
  --card-2: #12224A;
  --card-hi: #08143A;
  --line: #1C2E63;
  --ink: #EAF0FF;
  --ink-strong: #FFFFFF;
  --muted: #9DB0D9;
  --soft: #C9D6F2;
  --blue: #1F63E6;
  --cyan: #4CC3FF;
  --purple: #B79BFF;
  --violet: #6A3DF0;
  --green: #3DDC97;
  --green-bg: #0B3A2C;
  --amber: #FBBF24;
  --danger: #FF8A8A;
  --glow: 0 0 24px rgba(47, 123, 255, 0.45);
  --radius: 16px;
  --font: 'Plus Jakarta Sans', 'Noto Sans Sinhala', 'Noto Sans Tamil', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body[data-lang="si"] { --font: 'Noto Sans Sinhala', 'Plus Jakarta Sans', system-ui, sans-serif; }
body[data-lang="ta"] { --font: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif; }
body[data-lang="hi"] { --font: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif; }
body[data-lang="zh"] { --font: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Plus Jakarta Sans', system-ui, sans-serif; }

a { color: var(--cyan); }
a:hover { color: #8AD8FF; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Background network */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; display: flex; justify-content: center; }
.bg svg { width: min(100vw, 560px); height: 100%; flex: none; }
.center .badge { align-self: center; }
/* Reduced motion: app.js pauses the background animation */

/* Layout */
.app {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
.page { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 20px; }
.page.with-nav { padding-bottom: 100px; }
.loading { flex: 1; display: grid; place-items: center; }

/* Brand */
.logo-glow { display: block; object-fit: contain; filter: drop-shadow(0 0 10px rgba(47, 123, 255, 0.55)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.wordmark { display: flex; flex-direction: column; gap: 4px; }
.wordmark .w1 { font-family: 'Michroma', sans-serif; font-size: 21px; letter-spacing: 3px; color: var(--ink-strong); line-height: 1.15; }
.wordmark .w2 { font-family: 'Michroma', sans-serif; font-size: 11px; letter-spacing: 7.5px; color: var(--cyan); line-height: 1.15; }
.brand .logo-glow { width: 64px; height: 64px; }

/* Big brand moment: login screen and app start */
.brand-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.brand-hero .logo-glow { width: 136px; height: 136px; filter: drop-shadow(0 0 22px rgba(47, 123, 255, 0.7)); }
.brand-hero .wordmark { align-items: center; gap: 8px; }
.brand-hero .w1 { font-size: 30px; letter-spacing: 6px; padding-left: 6px; }
.brand-hero .w2 { font-size: 13px; letter-spacing: 12px; padding-left: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .brand-hero .logo-glow { animation: logo-pulse 3s ease-in-out infinite; }
  @keyframes logo-pulse {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(47, 123, 255, 0.55)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px rgba(76, 195, 255, 0.85)); transform: scale(1.03); }
  }
}
.topbar { display: flex; justify-content: space-between; align-items: center; }
.link-btn { background: none; border: 0; color: var(--cyan); font-weight: 700; font-size: 15px; padding: 12px 4px; cursor: pointer; text-decoration: none; }

/* Text */
h1, h2, h3 { margin: 0; color: var(--ink-strong); }
.h1 { font-size: 32px; line-height: 1.12; font-weight: 800; letter-spacing: -0.8px; }
.h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.h3 { font-size: 18px; font-weight: 800; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tagline { font-size: 14px; font-style: italic; color: var(--cyan); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 12px; }
.center { text-align: center; align-items: center; }

/* Pills */
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--soft); font-size: 14px; font-weight: 600;
  cursor: pointer; min-height: 40px;
}
.pill[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.pill.sm { padding: 5px 12px; font-size: 13px; min-height: 32px; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.card.hi { background: var(--card-hi); border-color: var(--cyan); box-shadow: 0 0 22px rgba(76, 195, 255, 0.22); }
.icon-tile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.icon-tile.blue { background: var(--blue); box-shadow: 0 0 16px rgba(47, 123, 255, 0.5); }
.icon-tile.violet { background: var(--violet); box-shadow: 0 0 16px rgba(140, 90, 255, 0.5); }
.icon-tile.plain { background: var(--card-2); }
.card-title { font-size: 19px; font-weight: 700; color: var(--ink-strong); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: #DCE5FA; }
.checks li::before { content: '✓  '; color: var(--cyan); font-weight: 700; }
.checks.violet li::before { color: var(--purple); }
.toggle { background: none; border: 0; padding: 10px 0; color: var(--cyan); font-weight: 700; font-size: 15px; text-align: left; cursor: pointer; }
.toggle.violet { color: var(--purple); }

/* Packages */
.pkg { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.pkg-name { font-weight: 700; font-size: 17px; color: var(--ink-strong); }
.pkg-price { font-weight: 800; font-size: 20px; color: var(--ink-strong); }
.pkg-price span { font-weight: 500; font-size: 14px; color: var(--muted); }
.badge { align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: var(--cyan); color: #04122E; font-size: 12px; font-weight: 700; }
.badge.demo { background: #2A1F5C; color: #CDBDFF; }
.badge.soon { background: var(--card-2); color: var(--soft); font-weight: 600; }
.badge.free { background: var(--green-bg); color: #A7F3CF; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 0 20px; border-radius: 16px; border: 0;
  background: var(--blue); color: #fff; font-weight: 700; font-size: 17px;
  box-shadow: var(--glow); cursor: pointer; text-decoration: none; width: 100%;
}
.btn:hover { background: #2A6EF0; color: #fff; }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); box-shadow: none; font-weight: 600; font-size: 15px; min-height: 52px; }
.btn.outline { background: transparent; border: 1.5px solid var(--cyan); color: var(--cyan); box-shadow: none; min-height: 48px; font-size: 15px; }
.btn.small { min-height: 44px; font-size: 15px; width: auto; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-size: 14px; font-weight: 600; color: #DCE5FA; }
.input {
  height: 52px; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 16px;
  background: var(--card); color: var(--ink-strong); font-size: 16px; width: 100%; min-width: 0;
}
.input::placeholder { color: #6F82AE; }
.input:focus { border-color: var(--cyan); outline: none; }
.input.code { text-align: center; font-size: 26px; letter-spacing: 10px; font-weight: 700; height: 64px; }
.prefix { height: 52px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); display: flex; align-items: center; font-weight: 600; color: var(--ink-strong); }
.error { color: var(--danger); font-size: 14px; font-weight: 600; min-height: 0; }
.notice { color: #A7F3CF; font-size: 14px; font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--blue); color: #fff; font-weight: 700; }

/* Dashboard */
.verdict { border-radius: 22px; padding: 20px; background: var(--card-hi); border: 1px solid var(--cyan); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 22px rgba(76, 195, 255, 0.18); }
.step { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 15px; text-decoration: none; color: var(--ink); }
.step .dot { width: 24px; height: 24px; border-radius: 999px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.step.done .dot { background: var(--green); border-color: var(--green); }
.step.done span.t { color: #7C8FBA; text-decoration: line-through; }
.step .t { flex: 1; }
.platform { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.platform .grow { flex: 1; }
.platform .name { font-size: 16px; font-weight: 700; color: var(--ink-strong); }

/* Bottom nav */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 5;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  background: rgba(7, 16, 49, 0.96); border-top: 1px solid var(--line);
  padding: 8px 8px calc(12px + env(safe-area-inset-bottom));
}
.nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; text-decoration: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav a[aria-current="page"] { color: var(--cyan); font-weight: 700; }
.nav svg { width: 24px; height: 24px; }

.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: var(--card-2); border: 1px solid var(--cyan); color: var(--ink-strong);
  padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 10;
  max-width: calc(100% - 32px);
}
.footer-cta { padding: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; margin-top: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }


/* Distinct, always-visible sandbox banner. This file is never a production deployment. */
.local-demo-banner { position: sticky; top: 0; z-index: 40; background: #172343; border-bottom: 1px solid #5F83E8;
 color: #EAF0FF; width:100%; padding: 10px 14px; box-shadow: 0 5px 20px #0008; }
.local-demo-inner { max-width: 480px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.local-demo-copy {font-size:12px; line-height:1.4;}
.local-demo-copy strong { display:block; color:#A9DCFF; font-size:12px; letter-spacing: .6px; }
.local-demo-reset { border:1px solid #7697EF; background:transparent; border-radius:8px; padding:8px 10px; font-size:12px;
 font-weight:700; color: #fff; cursor:pointer; white-space:nowrap; }
.local-demo-reset:hover { background:#2A4681; }
@media (max-width:350px) { .local-demo-copy{font-size:11px;} .local-demo-reset{font-size:11px;padding:7px;} }

/* Quote CTA: actionable but no payment or automatic sending. */
.pkg-quote { display:flex; width:100%; gap:10px; align-items:center; justify-content:center;
  min-height:48px; border:1px solid #25D366; border-radius:13px; padding:10px 14px;
  background: #0D382D; color:#D6FFE8; font-size:15px; font-weight:800; cursor:pointer; }
.pkg-quote:hover, .pkg-quote:focus-visible { background:#15533D; }
.pkg-quote svg {width:22px;height:22px;flex:none;}
.quote-overlay {position:fixed;inset:0;background:rgba(2,6,20,.87);z-index:100;
  padding:20px 14px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;}
.quote-modal {background:#0D1A3F;color:#EAF0FF;border:1px solid #4CC3FF;
  border-radius:24px;max-width:470px;width:100%;max-height:92dvh;overflow:auto;
  padding:22px;box-shadow:0 20px 80px #000d;}
.quote-top {display:flex;align-items:start;justify-content:space-between;gap:8px;}
.quote-close {background:#182C59;border:1px solid #355486;border-radius:12px;color:#EAF0FF;
  min-width:44px;min-height:44px;cursor:pointer;font-weight:bold;font-size:22px;}
.quote-hint {font-size:13px;color:#ABC0E7;line-height:1.55;}
.quote-edit {width:100%;min-height:145px;max-height:38dvh;resize:vertical;padding:12px;
  background:#071637;color:#EAF0FF;border-radius:14px;border:1px solid #355486;font:inherit;font-size:14px;line-height:1.55;}
.quote-recipient {width:100%;min-height:49px;padding:12px;background:#071637;
  color:#EAF0FF;border:1px solid #355486;border-radius:12px;font:inherit;font-size:16px;}
.quote-primary {width:100%;min-height:50px;border:0;background:#178C56;color:#FFF;
  border-radius:14px;font:inherit;font-weight:800;cursor:pointer;}
.quote-secondary {width:100%;min-height:47px;background:transparent;color:#C4E9FF;
  border:1px solid #467DAD;border-radius:14px;font:inherit;font-weight:750;cursor:pointer;}
.quote-label {font-weight:700;font-size:13px;color:#D7E5FF;display:block;margin-bottom:5px;}
.quote-error {color:#FFB0B0;font-weight:700;font-size:13px;min-height:18px;}
.quote-stack {display:flex;flex-direction:column;gap:12px;}
.page.with-nav { padding-bottom:135px; }
.nav { background:rgba(7,16,49,.99); }


/* Official fixed WhatsApp recipient: no customer-editable destination. */
.quote-fixed-recipient { padding: 12px 14px; border: 1px solid rgba(76,195,255,.36); border-radius: 12px; background: rgba(76,195,255,.07); }
.quote-fixed-recipient strong { display: block; color: #eaf0ff; font-size: 17px; letter-spacing: .3px; padding: 4px 0; }

        '<div class="field"><label for="f-password">Password</label>' +
          '<input class="input" id="f-password" name="password" type="password" autocomplete="' + (signup ? 'new-password' : 'current-password') + '" required minlength="8" maxlength="128" value="' + esc(f.password || '') + '"></div>' +
        (signup ? '<div class="field"><span class="label" id="type-label">' + esc(t('biz_type')) + '</span>' +
          '<div class="pills" role="group" aria-labelledby="type-label">' + types + '</div></div>' : '') +
        '<div class="muted small">You must verify your email before saving your business profile. Never reuse the demonstration code 123456.</div>' +
        errorBox() + noticeBox() +
      '</div>' +
      '<div class="stack" style="margin-top:auto">' +
        '<button class="btn" type="submit"' + (state.busy ? ' disabled' : '') + '>' + (signup ? 'Create account & send verification email' : 'Log in') + '</button>' +
        (!signup ? '<button class="btn ghost" type="button" data-action="reset-password">Forgot password?</button>' : '') +
      '</div></form>';
  }

  function viewVerify() {
    var p = state.pending;
    return '<form class="page" data-form="verify" novalidate>' +
      '<a class="icon-btn" href="#/login" aria-label="' + esc(t('back')) + '">' + ICON.back + '</a>' +
      '<div class="stack">' +
        '<h1 class="h2">' + esc(t('enter_code')) + '</h1>' +
        '<p class="muted" style="margin:0">Please verify your email, then return to login.</p>' +
        (DEMO ? '<span class="badge demo">' + esc(t('demo_code')) + '</span>' : '') +
      '</div>' +
      '<div class="field"><label for="f-code" class="sr-only">' + esc(t('enter_code')) + '</label>' +
        '<input class="input code" id="f-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div>' +
      errorBox() + noticeBox() +
      '<div class="row" style="justify-content:space-between">' +
        '<button type="button" class="link-btn" data-action="resend">' + esc(t('resend')) + '</button>' +
        '<a class="link-btn" href="#/login" style="color:var(--muted)">' + esc(t('change_number')) + '</a>' +
      '</div>' +
      '<div style="margin-top:auto"><button class="btn" type="submit"' + (state.busy ? ' disabled' : '') + '>' + esc(t('verify')) + '</button></div>' +
    '</form>';
  }

  function viewWelcome() {
    var f = state.form;
    var types = TYPES.map(function (ty) {
      return '<button type="button" class="pill" data-action="pick-type" data-type="' + ty + '" aria-pressed="' + (f.type === ty) + '">' + esc(t('type_' + ty)) + '</button>';
    }).join('');
    return '<form class="page" data-form="business" novalidate>' +
      '<div class="topbar">' + brand() + '</div>' +
      '<h1 class="h2">' + esc(t('tell_us')) + '</h1>' +
      '<div class="field"><label for="f-name">' + esc(t('biz_name')) + '</label>' +
        '<input class="input" id="f-name" name="name" autocomplete="organization" maxlength="120" placeholder="' + esc(t('biz_placeholder')) + '" value="' + esc(f.name) + '"></div>' +
      '<div class="field"><span class="label" id="type-label">' + esc(t('biz_type')) + '</span>' +
        '<div class="pills" role="group" aria-labelledby="type-label">' + types + '</div></div>' +
      errorBox() +
      '<div style="margin-top:auto"><button class="btn" type="submit"' + (state.busy ? ' disabled' : '') + '>' + esc(t('save')) + '</button></div>' +
    '</form>';
  }

  function viewDashboard() {
    var b = state.business || {};
    var initial = (b.business_name || '?').trim().charAt(0).toUpperCase();
    var platforms = [
      ['fb', 'Facebook', '<span class="muted small">' + esc(t('soon')) + '</span>'],
      ['ig', 'Instagram', '<span class="muted small">' + esc(t('soon')) + '</span>'],
      ['tt', 'TikTok', '<span class="muted small">' + esc(t('soon')) + '</span>'],
      ['yt', 'YouTube', '<span class="muted small">' + esc(t('soon')) + '</span>']
    ];
    return '<div class="page with-nav">' +
      '<div class="topbar"><div class="row">' +
        '<img src="' + window.AG_LOGO + '" alt="Artemis Network" class="logo-glow" width="56" height="56">' +
        '<div><div class="muted small">' + esc(greeting()) + '</div>' +
        '<h1 style="font-size:21px;font-weight:800;letter-spacing:-.4px">' + esc(b.business_name) + '</h1></div></div>' +
        '<a class="icon-btn" href="#/account" aria-label="' + esc(t('account')) + '" style="border-radius:999px;text-decoration:none;color:#fff;font-weight:700">' + esc(initial) + '</a>' +
      '</div>' + demoBadge() +
      '<section class="verdict" aria-labelledby="verdict-h">' +
        '<h2 class="h3" id="verdict-h">' + esc(t('verdict_empty_title')) + '</h2>' +
        '<p class="muted" style="margin:0;font-size:15px">' + esc(t('verdict_empty_sub')) + '</p>' +
      '</section>' +
      '<section class="stack" aria-labelledby="setup-h">' +
        '<h2 class="h3" id="setup-h">' + esc(t('setup_title')) + '</h2>' +
        '<div class="step done"><span class="dot">' + ICON.check + '</span><span class="t">' + esc(t('step_account')) + '</span></div>' +
        '<div class="step"><span class="dot"></span><span class="t">' + esc(t('step_fb')) + '</span><span class="badge soon">' + esc(t('soon')) + '</span></div>' +
        '<a class="step" href="#/packages"><span class="dot"></span><span class="t">' + esc(t('step_packages')) + '</span><span aria-hidden="true" style="color:var(--cyan)">→</span></a>' +
      '</section>' +
      '<section class="stack" aria-labelledby="pages-h">' +
        '<h2 class="h3" id="pages-h">' + esc(t('your_pages')) + '</h2>' +
        platforms.map(function (p) {
          return '<div class="platform"><div class="icon-tile plain">' + ICON[p[0]] + '</div>' +
            '<div class="grow"><div class="name">' + p[1] + '</div>' + p[2] + '</div>' +
            '<span class="badge soon">' + esc(t('soon')) + '</span></div>';
        }).join('') +
      '</section>' +
    '</div>' + nav('#/dashboard');
  }

  function viewPackages() {
    return '<div class="page with-nav">' +
      '<h1 class="h2">' + esc(t('nav_packages')) + '</h1>' +
      categoryCard('digital_marketing', { alwaysOpen: true, withAsk: true }) +
      categoryCard('growth_systems', { alwaysOpen: true, withAsk: true }) +
    '</div>' + nav('#/packages');
  }

  function viewAccount() {
    var b = state.business || {};
    var f = state.form;
    var types = TYPES.map(function (ty) {
      return '<button type="button" class="pill" data-action="pick-type" data-type="' + ty + '" aria-pressed="' + (f.type === ty) + '">' + esc(t('type_' + ty)) + '</button>';
    }).join('');
    var phone = (state.session && state.session.user && state.session.user.phone) || b.phone || '';
    if (phone && phone.charAt(0) !== '+') phone = '+' + phone;
    return '<form class="page with-nav" data-form="account" novalidate>' +
      '<h1 class="h2">' + esc(t('account')) + '</h1>' + demoBadge() +
      '<div class="field"><label for="f-name">' + esc(t('biz_name')) + '</label>' +
        '<input class="input" id="f-name" name="name" maxlength="120" value="' + esc(f.name) + '"></div>' +
      '<div class="field"><span class="label" id="type-label">' + esc(t('biz_type')) + '</span>' +
        '<div class="pills" role="group" aria-labelledby="type-label">' + types + '</div></div>' +
      (phone ? '<div class="field"><span class="label">' + esc(t('whatsapp')) + '</span><div class="muted">' + esc(prettyPhone(phone)) + '</div></div>' : '') +
      '<div class="field"><span class="label">' + esc(t('language')) + '</span>' + langPills() + '</div>' +
      errorBox() +
      '<button class="btn" type="submit"' + (state.busy ? ' disabled' : '') + '>' + esc(t('save_changes')) + '</button>' +
      '<button class="btn ghost" type="button" data-action="logout">' + esc(t('logout')) + '</button>' +
    '</form>' + nav('#/account');
  }

  // ---------- router ----------
  var PRIVATE = ['#/dashboard', '#/account', '#/welcome'];
  var lastRoute = null;

  async function render() {
    var r = route();
    var app = document.getElementById('app');
    document.body.setAttribute('data-lang', state.lang);
    document.documentElement.lang = state.lang;

    if (r !== lastRoute) { state.error = ''; state.notice = ''; }

    var loggedIn = !!state.session;
    if (PRIVATE.indexOf(r) !== -1 && !loggedIn) { state.authTab = 'login'; return go('#/login'); }
    if (loggedIn && state.business === undefined) await loadBusiness();
    if (loggedIn && !state.business && r !== '#/welcome') return go('#/welcome');
    if (loggedIn && state.business && (r === '#/login' || r === '#/verify' || r === '#/welcome')) return go('#/dashboard');
    if (r === '#/verify') return go('#/login');

    if (r !== lastRoute) {
      // Prefill forms when entering a screen.
      if (r === '#/account' && state.business) state.form = Object.assign({}, state.form, { name: state.business.business_name, type: state.business.business_type });
      if (r === '#/welcome') state.form = Object.assign({}, state.form, { name: state.form.name || '', type: state.form.type || '' });
    }

    if (r === '#/' || r === '#/packages') await loadPackages();

    var html;
    switch (r) {
      case '#/login': html = viewLogin(); break;
      case '#/verify': html = viewVerify(); break;
      case '#/welcome': html = viewWelcome(); break;
      case '#/dashboard': html = viewDashboard(); break;
      case '#/packages': html = viewPackages(); break;
      case '#/account': html = viewAccount(); break;
      default: html = viewHome();
    }
    app.innerHTML = html;
    if (r !== lastRoute) window.scrollTo(0, 0);
    lastRoute = r;
  }

  // Re-render without losing what the person typed.
  function rerender() {
    var focusId = document.activeElement && document.activeElement.id;
    var inputs = {};
    document.querySelectorAll('#app input').forEach(function (i) { if (i.id) inputs[i.id] = i.value; });
    syncForm();
    return render().then(function () {
      Object.keys(inputs).forEach(function (id) { var el = document.getElementById(id); if (el) el.value = inputs[id]; });
      if (focusId) { var f = document.getElementById(focusId); if (f && f.focus) f.focus(); }
    });
  }
  function syncForm() {
    var n = document.getElementById('f-name');
    var e = document.getElementById('f-email');
    var p = document.getElementById('f-password');
    if (n) state.form.name = n.value;
    if (e) state.form.email = e.value;
    if (p) state.form.password = p.value;
  }

  // ---------- actions ----------
  async function withBusy(fn) {
    if (state.busy) return;
    state.busy = true; state.error = ''; state.notice = '';
    await rerender();
    try { await fn(); }
    catch (e) {
      if (!e || e.code !== 'bad_code') console.error(e);
      var messages = {
        'auth/email-already-in-use': 'That email is already registered. Please log in.',
        'auth/invalid-email': 'Enter a valid email address.',
        'auth/weak-password': 'Please use a stronger password.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'permission-denied': 'Access denied. Check your Firestore security rules.',
        'unavailable': 'Network unavailable. Please try again.'
      };
      state.error = messages[e && e.code] || (e && e.message && /^Please |^Enter |^If an account/.test(e.message) ? e.message : t('err_generic'));
    }
    state.busy = false;
    await rerender();
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');

    if (a === 'lang') {
      state.lang = el.getAttribute('data-lang');
      store.set('lang', state.lang);
      if (state.business && state.session && !DEMO) {
        api.saveBusiness({ business_name: state.business.business_name, business_type: state.business.business_type, phone: state.business.phone }).catch(console.error);
      }
      rerender();
    } else if (a === 'quote') {
      quotePopup(el.getAttribute('data-package'));
    } else if (a === 'toggle-cat') {
      var c = el.getAttribute('data-cat');
      state.openCat = state.openCat === c ? null : c;
      rerender();
    } else if (a === 'go-login') {
      state.authTab = el.getAttribute('data-tab') || 'signup';
    } else if (a === 'auth-tab') {
      syncForm();
      state.authTab = el.getAttribute('data-tab');
      state.error = '';
      rerender();
    } else if (a === 'pick-type') {
      syncForm();
      state.form.type = el.getAttribute('data-type');
      state.error = '';
      rerender();
    } else if (a === 'reset-password') {
      syncForm();
      withBusy(async function () {
        var email = String(state.form.email || '').trim();
        if (!email) throw new Error('Enter your email address first.');
        await api.resetPassword(email);
        state.notice = 'If an account exists for that address, a password-reset email will be sent.';
      });
    } else if (a === 'logout') {
      withBusy(async function () {
        await api.logout();
        state.session = null; state.business = undefined; state.pending = null;
        store.del('pending');
        go('#/');
      });
    }
  });

  document.addEventListener('submit', function (ev) {
    var form = ev.target.closest('[data-form]');
    if (!form) return;
    ev.preventDefault();
    syncForm();
    var kind = form.getAttribute('data-form');
    var f = state.form;

    if (kind === 'auth') {
      var signup = state.authTab === 'signup';
      var email = String(f.email || '').trim().toLowerCase();
      var pw = String(f.password || '');
      if (signup && !f.name.trim()) { state.error = t('err_name'); return rerender(); }
      if (!/^\S+@\S+\.\S+$/.test(email)) { state.error = 'Enter a valid email address.'; return rerender(); }
      if (pw.length < 8) { state.error = 'Password must have at least 8 characters.'; return rerender(); }
      if (signup && TYPES.indexOf(f.type) === -1) { state.error = t('err_type'); return rerender(); }
      withBusy(async function () {
        if (signup) {
          await api.signup(email, pw);
          // Do not write profile data until the email is verified and login succeeds.
          state.form.password = '';
          state.authTab = 'login';
          state.notice = 'Verification email sent. Open your inbox, verify your address, then log in.';
        } else {
          state.session = await api.login(email, pw);
          state.form.password = '';
          state.business = undefined;
          await loadBusiness();
          go(state.business ? '#/dashboard' : '#/welcome');
        }
      });
    }

    if (kind === 'business' || kind === 'account') {
      if (!f.name.trim()) { state.error = t('err_name'); return rerender(); }
      if (TYPES.indexOf(f.type) === -1) { state.error = t('err_type'); return rerender(); }
      withBusy(async function () {
        var phone = (state.session.user && state.session.user.phone) || (state.business && state.business.phone) || (state.pending && state.pending.phone) || null;
        if (phone && phone.charAt(0) !== '+') phone = '+' + phone;
        state.business = await api.saveBusiness({ business_name: f.name.trim(), business_type: f.type, phone: phone });
        state.pending = null; store.del('pending');
        if (kind === 'business') go('#/dashboard'); else toast(t('saved'));
      });
    }
  });

  // Clear an old error message as soon as the person starts fixing it.
  document.addEventListener('input', function () {
    if (!state.error) return;
    state.error = '';
    var box = document.querySelector('#app .error');
    if (box) box.textContent = '';
  });

  window.addEventListener('hashchange', render);


  // ---------- start ----------
  // Respect "reduce motion": freeze the background network.
  try {
    var bgSvg = document.querySelector('.bg svg');
    var rm = window.matchMedia('(prefers-reduced-motion: reduce)');
    var applyMotion = function () { if (!bgSvg || !bgSvg.pauseAnimations) return; if (rm.matches) bgSvg.pauseAnimations(); else bgSvg.unpauseAnimations(); };
    applyMotion();
    if (rm.addEventListener) rm.addEventListener('change', applyMotion);
  } catch (e) { /* matchMedia unavailable */ }

  (async function start() {
    try {
      await window.AG_FB_READY;
      fb = window.AG_FB;
      if (location.protocol === 'file:') throw new Error('Open this through an HTTPS website, not file://');
      state.session = await api.getSession();
      if (state.session && (route() === '#/' || route() === '#/login')) location.hash = '#/dashboard';
      render();
    } catch (e) {
      console.error(e);
      document.getElementById('app').innerHTML = '<div class="page"><h1>ARTEMIS GROW connection error</h1><p>The Firebase connection is unavailable. Confirm the Web App configuration and use an HTTPS testing address.</p></div>';
    }
  })();
})();

</script>
</body>
</html>
